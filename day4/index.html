<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Counter</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Note Counter</h1>

    <button id="theme-toggle">Dark mode</button>

    <label for="note-text">Write your note</label>
    <textarea id="note-text" rows="8" placeholder="Start typing here..."></textarea>

    <p id="char-count">0 / 200 characters</p>
    <p id="word-count">0 words</p>

    <button id="clear-btn">Clear</button>
  </main>
</body>
</html>
